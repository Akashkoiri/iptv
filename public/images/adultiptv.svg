<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18040a" />
      <stop offset="50%" stop-color="#2a0814" />
      <stop offset="100%" stop-color="#0d0205" />
    </linearGradient>
    <linearGradient id="roseAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="120" rx="20" fill="url(#bgGrad)" stroke="#f43f5e" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle Glow Accent -->
  <circle cx="50" cy="60" r="35" fill="#f43f5e" opacity="0.15" filter="url(#glow)" />

  <!-- 18+ Badge Icon -->
  <g transform="translate(24, 30)">
    <circle cx="30" cy="30" r="28" fill="#1f0710" stroke="url(#roseAccent)" stroke-width="2.5" />
    <text x="30" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="20" letter-spacing="-0.5">18+</text>
  </g>

  <!-- Typography: ADULT IPTV -->
  <g transform="translate(98, 48)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1">ADULT</text>
    <text x="96" y="0" fill="url(#roseAccent)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5">IPTV</text>
    <rect x="166" y="-18" width="46" height="20" rx="5" fill="#e11d48" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1" />
    <text x="189" y="-4" text-anchor="middle" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="11" letter-spacing="0.5">LIVE</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="98" y="78" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1.5">24/7 ADULT BROADCASTS</text>

  <!-- Live Pulse Dot -->
  <circle cx="300" cy="20" r="4" fill="#ef4444" />
  <circle cx="300" cy="20" r="7" fill="#ef4444" opacity="0.3">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
