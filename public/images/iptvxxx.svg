<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="xxxBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#190409" />
      <stop offset="50%" stop-color="#2d0812" />
      <stop offset="100%" stop-color="#0f0205" />
    </linearGradient>
    <linearGradient id="crimsonAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="50%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb7185" />
    </linearGradient>
    <filter id="xxxGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="120" rx="20" fill="url(#xxxBg)" stroke="#e11d48" stroke-width="2" stroke-opacity="0.35" />
  
  <!-- Subtle Glow Accent -->
  <circle cx="50" cy="60" r="35" fill="#e11d48" opacity="0.2" filter="url(#xxxGlow)" />

  <!-- Triple X Badge Icon -->
  <g transform="translate(24, 30)">
    <circle cx="30" cy="30" r="28" fill="#20060d" stroke="url(#crimsonAccent)" stroke-width="2.5" />
    <text x="30" y="38" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" letter-spacing="1">XXX</text>
  </g>

  <!-- Typography: IPTV XXX -->
  <g transform="translate(98, 48)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1">IPTV</text>
    <text x="64" y="0" fill="url(#crimsonAccent)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="2">XXX</text>
    <rect x="136" y="-18" width="50" height="20" rx="5" fill="#e11d48" fill-opacity="0.25" stroke="#f43f5e" stroke-width="1" />
    <text x="161" y="-4" text-anchor="middle" fill="#fda4af" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">1080p</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="98" y="78" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1.2">PREMIUM NETWORK STREAMS</text>

  <!-- Live Pulse Dot -->
  <circle cx="300" cy="20" r="4" fill="#f43f5e" />
  <circle cx="300" cy="20" r="7" fill="#f43f5e" opacity="0.3">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
