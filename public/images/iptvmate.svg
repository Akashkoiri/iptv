<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="mateBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0720" />
      <stop offset="50%" stop-color="#1e0b36" />
      <stop offset="100%" stop-color="#0a0314" />
    </linearGradient>
    <linearGradient id="purpleAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="50%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="mateGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="120" rx="20" fill="url(#mateBg)" stroke="#a855f7" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle Glow Accent -->
  <circle cx="50" cy="60" r="35" fill="#a855f7" opacity="0.18" filter="url(#mateGlow)" />

  <!-- Play / Signal Badge Icon -->
  <g transform="translate(24, 30)">
    <circle cx="30" cy="30" r="28" fill="#170729" stroke="url(#purpleAccent)" stroke-width="2.5" />
    <path d="M25 20 L40 30 L25 40 Z" fill="#c084fc" />
    <circle cx="41" cy="20" r="3" fill="#ec4899" />
  </g>

  <!-- Typography: IPTVMATE -->
  <g transform="translate(98, 48)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1">IPTV</text>
    <text x="64" y="0" fill="url(#purpleAccent)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5">MATE</text>
    <rect x="156" y="-18" width="56" height="20" rx="5" fill="#a855f7" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" />
    <text x="184" y="-4" text-anchor="middle" fill="#e9d5ff" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">M3U FEED</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="98" y="78" fill="#a1a1aa" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1.2">PREMIUM 24/7 LIVE STREAM</text>

  <!-- Live Pulse Dot -->
  <circle cx="300" cy="20" r="4" fill="#a855f7" />
  <circle cx="300" cy="20" r="7" fill="#a855f7" opacity="0.3">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
