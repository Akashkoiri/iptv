<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none">
  <defs>
    <linearGradient id="camBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05131f" />
      <stop offset="50%" stop-color="#0a2540" />
      <stop offset="100%" stop-color="#030c14" />
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="camGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="320" height="120" rx="20" fill="url(#camBg)" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle Glow Accent -->
  <circle cx="50" cy="60" r="35" fill="#0ea5e9" opacity="0.18" filter="url(#camGlow)" />

  <!-- Camera / Cam Lens Badge Icon -->
  <g transform="translate(24, 30)">
    <circle cx="30" cy="30" r="28" fill="#071a2c" stroke="url(#cyanAccent)" stroke-width="2.5" />
    <circle cx="30" cy="30" r="14" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
    <circle cx="30" cy="30" r="6" fill="#e0f2fe" />
    <circle cx="43" cy="18" r="3" fill="#f43f5e" />
  </g>

  <!-- Typography: MYCAM TV -->
  <g transform="translate(98, 48)">
    <text x="0" y="0" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1">MYCAM</text>
    <text x="108" y="0" fill="url(#cyanAccent)" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" letter-spacing="1.5">TV</text>
    <rect x="156" y="-18" width="50" height="20" rx="5" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" />
    <text x="181" y="-4" text-anchor="middle" fill="#7dd3fc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="0.5">LIVE</text>
  </g>

  <!-- Subtitle Tagline -->
  <text x="98" y="78" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="11" letter-spacing="1.2">24/7 INTERACTIVE CAMS</text>

  <!-- Live Pulse Dot -->
  <circle cx="300" cy="20" r="4" fill="#38bdf8" />
  <circle cx="300" cy="20" r="7" fill="#38bdf8" opacity="0.3">
    <animate attributeName="r" values="4;9;4" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0;0.6" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>
